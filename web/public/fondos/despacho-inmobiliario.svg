<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Despacho de asesoría inmobiliaria, cálido, con maqueta, planos y gráfico de mercado">
  <defs>
    <linearGradient id="pared2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7edda"/>
      <stop offset="1" stop-color="#e8d5b4"/>
    </linearGradient>
    <linearGradient id="atardecer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdeecb"/>
      <stop offset="1" stop-color="#f6dcae"/>
    </linearGradient>
    <linearGradient id="suelo2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b98a"/>
      <stop offset="1" stop-color="#c19f68"/>
    </linearGradient>
    <radialGradient id="sol2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d4" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff3d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="d18b" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="d6b" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- pared y suelo -->
  <rect width="1600" height="900" fill="url(#pared2)"/>
  <rect y="640" width="1600" height="260" fill="url(#suelo2)"/>
  <g stroke="#a98a58" stroke-width="2" opacity="0.3">
    <line x1="0" y1="712" x2="1600" y2="712"/>
    <line x1="0" y1="784" x2="1600" y2="784"/>
  </g>

  <!-- estantería con carpeteros -->
  <g>
    <rect x="70" y="110" width="380" height="510" rx="10" fill="#c9a267"/>
    <rect x="88" y="128" width="344" height="474" fill="#b98f55"/>
    <line x1="88" y1="286" x2="432" y2="286" stroke="#a37c46" stroke-width="10"/>
    <line x1="88" y1="444" x2="432" y2="444" stroke="#a37c46" stroke-width="10"/>
    <g>
      <rect x="104" y="176" width="34" height="104" rx="4" fill="#ece6d5"/>
      <rect x="142" y="170" width="30" height="110" rx="4" fill="#0f8a5f"/>
      <rect x="176" y="182" width="38" height="98" rx="4" fill="#d9c08a"/>
      <rect x="218" y="174" width="32" height="106" rx="4" fill="#ece6d5"/>
      <rect x="254" y="180" width="36" height="100" rx="4" fill="#9db3a4"/>
      <rect x="294" y="172" width="30" height="108" rx="4" fill="#0f8a5f"/>
      <rect x="328" y="184" width="36" height="96" rx="4" fill="#e2cfa8"/>

      <rect x="100" y="336" width="36" height="102" rx="4" fill="#d9c08a"/>
      <rect x="140" y="330" width="32" height="108" rx="4" fill="#ece6d5"/>
      <rect x="176" y="340" width="36" height="98" rx="4" fill="#0f8a5f"/>
      <rect x="216" y="332" width="30" height="106" rx="4" fill="#b8a684"/>
      <rect x="250" y="338" width="38" height="100" rx="4" fill="#ece6d5"/>
      <rect x="292" y="330" width="32" height="108" rx="4" fill="#c98a5a"/>

      <rect x="106" y="494" width="34" height="102" rx="4" fill="#9db3a4"/>
      <rect x="144" y="488" width="36" height="108" rx="4" fill="#ece6d5"/>
      <rect x="184" y="496" width="30" height="100" rx="4" fill="#0f8a5f"/>
      <rect x="218" y="490" width="38" height="106" rx="4" fill="#e2cfa8"/>
      <rect x="260" y="494" width="32" height="102" rx="4" fill="#d9c08a"/>
    </g>
  </g>

  <!-- ventana cálida -->
  <g>
    <rect x="1120" y="90" width="420" height="500" rx="14" fill="url(#atardecer)"/>
    <ellipse cx="1330" cy="200" rx="180" ry="130" fill="url(#sol2)"/>
    <g opacity="0.55">
      <rect x="1160" y="340" width="66" height="210" fill="#e4c8a0"/>
      <rect x="1246" y="300" width="54" height="250" fill="#eBd3ab"/>
      <rect x="1320" y="370" width="76" height="180" fill="#e4c8a0"/>
      <rect x="1416" y="320" width="58" height="230" fill="#eBd3ab"/>
      <rect x="1258" y="330" width="18" height="12" fill="#fdf7ea" opacity="0.9"/>
      <rect x="1432" y="360" width="18" height="12" fill="#fdf7ea" opacity="0.9"/>
    </g>
    <rect x="1120" y="90" width="420" height="500" rx="14" fill="none" stroke="#ffffff" stroke-width="14" opacity="0.85"/>
    <line x1="1330" y1="97" x2="1330" y2="583" stroke="#ffffff" stroke-width="9" opacity="0.85"/>
  </g>

  <!-- monitor con gráfico de mercado -->
  <g>
    <ellipse cx="860" cy="606" rx="280" ry="20" fill="#000000" opacity="0.14" filter="url(#d18b)"/>
    <rect x="620" y="130" width="480" height="300" rx="18" fill="#2b2b31"/>
    <rect x="638" y="148" width="444" height="264" rx="10" fill="#fcfaf4"/>
    <text x="672" y="200" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="27" font-weight="700" fill="#8a6b2f" letter-spacing="2">MERCADO INMOBILIARIO</text>
    <!-- skyline -->
    <g fill="#c9b183">
      <rect x="672" y="240" width="18" height="52"/>
      <rect x="694" y="256" width="14" height="36"/>
      <rect x="712" y="232" width="20" height="60"/>
      <rect x="736" y="252" width="16" height="40"/>
      <polygon points="672,240 681,228 690,240"/>
    </g>
    <!-- barras ascendentes -->
    <g>
      <rect x="790" y="330" width="44" height="52" rx="5" fill="#d9c08a"/>
      <rect x="844" y="310" width="44" height="72" rx="5" fill="#c9b183"/>
      <rect x="898" y="288" width="44" height="94" rx="5" fill="#7fae8f"/>
      <rect x="952" y="266" width="44" height="116" rx="5" fill="#2fae7d"/>
      <rect x="1006" y="240" width="44" height="142" rx="5" fill="#0f8a5f"/>
      <path d="M798 322 L866 298 L920 276 L974 252 L1028 226" fill="none" stroke="#8a6b2f" stroke-width="5" stroke-linecap="round"/>
      <polygon points="1028,226 1010,228 1022,242" fill="#8a6b2f"/>
    </g>
    <text x="672" y="398" font-family="system-ui, sans-serif" font-size="19" fill="#9a8a68">Valoración · Tasación · Valor añadido de la reforma energética</text>
    <rect x="800" y="430" width="120" height="14" rx="7" fill="#1f1f24"/>
  </g>

  <!-- escritorio -->
  <ellipse cx="820" cy="856" rx="660" ry="26" fill="#000000" opacity="0.1" filter="url(#d18b)"/>
  <rect x="150" y="598" width="1300" height="46" rx="12" fill="#e7ca98"/>
  <rect x="150" y="644" width="1300" height="14" fill="#cfa96e"/>
  <rect x="210" y="658" width="26" height="186" fill="#cfa96e"/>
  <rect x="1360" y="658" width="26" height="186" fill="#cfa96e"/>

  <!-- plano sobre el escritorio -->
  <g transform="translate(300,520) rotate(-3)">
    <rect x="0" y="0" width="240" height="86" rx="6" fill="#fdfcf7"/>
    <g stroke="#7fa3c4" stroke-width="2" opacity="0.8">
      <line x1="14" y1="16" x2="226" y2="16"/><line x1="14" y1="38" x2="226" y2="38"/>
      <line x1="14" y1="60" x2="226" y2="60"/>
      <line x1="70" y1="8" x2="70" y2="78"/><line x1="140" y1="8" x2="140" y2="78"/>
    </g>
    <rect x="14" y="8" width="56" height="70" fill="none" stroke="#4a7fb5" stroke-width="3"/>
    <text x="150" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#4a7fb5">PLANO</text>
  </g>

  <!-- maqueta de edificio -->
  <g transform="translate(620,492)">
    <ellipse cx="120" cy="112" rx="150" ry="14" fill="#000000" opacity="0.12" filter="url(#d6b)"/>
    <rect x="0" y="86" width="240" height="20" rx="5" fill="#cbb891"/>
    <g fill="#f7f3e8">
      <rect x="18" y="20" width="70" height="66" rx="4"/>
      <rect x="96" y="0" width="60" height="86" rx="4"/>
      <rect x="164" y="34" width="58" height="52" rx="4"/>
    </g>
    <g fill="#b9c8bd">
      <rect x="26" y="30" width="10" height="10"/><rect x="44" y="30" width="10" height="10"/><rect x="62" y="30" width="10" height="10"/>
      <rect x="26" y="50" width="10" height="10"/><rect x="44" y="50" width="10" height="10"/><rect x="62" y="50" width="10" height="10"/>
      <rect x="104" y="10" width="9" height="10"/><rect x="120" y="10" width="9" height="10"/><rect x="136" y="10" width="9" height="10"/>
      <rect x="104" y="32" width="9" height="10"/><rect x="120" y="32" width="9" height="10"/><rect x="136" y="32" width="9" height="10"/>
      <rect x="104" y="54" width="9" height="10"/><rect x="120" y="54" width="9" height="10"/>
      <rect x="172" y="44" width="9" height="10"/><rect x="190" y="44" width="9" height="10"/><rect x="172" y="64" width="9" height="10"/>
    </g>
  </g>

  <!-- planta de escritorio y cafetera -->
  <g transform="translate(960,560)">
    <ellipse cx="0" cy="-34" rx="36" ry="17" fill="#0f8a5f" transform="rotate(-22)"/>
    <ellipse cx="0" cy="-36" rx="36" ry="17" fill="#2fae7d"/>
    <ellipse cx="0" cy="-34" rx="36" ry="17" fill="#0f8a5f" transform="rotate(22)"/>
    <rect x="-26" y="-10" width="52" height="40" rx="7" fill="#ffffff"/>
  </g>
  <g transform="translate(1080,548)">
    <rect x="0" y="0" width="46" height="52" rx="8" fill="#33413c"/>
    <rect x="8" y="8" width="30" height="18" rx="3" fill="#9fd8bd"/>
  </g>

  <!-- luz de tarde -->
  <rect width="1600" height="900" fill="url(#sol2)" opacity="0.22"/>
</svg>
